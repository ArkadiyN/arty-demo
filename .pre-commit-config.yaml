repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        language: system
        entry: uv run ruff check --fix
        types: [python]

      - id: ty
        name: ty
        language: system
        entry: uvx ty check --python .venv
        pass_filenames: false
        types: [python]

      - id: mdformat
        name: mdformat
        language: system
        entry: uv run mdformat --extensions gfm --extensions frontmatter --extensions mkdocs
        types: [markdown]
        # These paths embed LaTeX math (subscripts, \cdot, etc.) that plain
        # mdformat corrupts (escapes underscores, doubles backslashes) — same
        # class of bug already worked around for .qmd via .mdformat-ignore,
        # but that file only applies to mdformat's own directory-mode
        # discovery, not to files pre-commit passes explicitly, hence the
        # exclude here too.
        #
        # doc-reference/ used to hit the same corruption (rspa.1947.0042.md:
        # \frac, \eqno, \% all mangled) but is no longer excluded: the
        # mdformat-mkdocs extension (--extensions mkdocs above) preserves
        # $...$/$$...$$ math verbatim, tested clean against doc-reference's
        # real content (plain prose/tables, no lists). .qmd/experiment/
        # openspec stay excluded — mdformat-mkdocs has a known edge case
        # there: a bullet-list item whose body contains a $$...$$ block
        # followed by more list text gets de-indented out of the list. That
        # pattern needs to be scanned for and fixed before those paths can be
        # safely un-excluded.
        #
        # openspec/ is excluded as the *whole tree* (`openspec/.*\.md$`), not
        # just `openspec/specs/`: math also appears in change proposals'
        # tasks.md/design.md and in archived specs/ snapshots under
        # `openspec/changes/archive/**`, which the narrower pattern used to
        # miss — 6 archived files (burst-geometry/shell-zone-model/
        # fragmentation-physics/pkill-ground-field specs + one tasks.md) were
        # found silently corrupted (double-escaped \\cos, \_ subscripts) by a
        # pre-mkdocs mdformat run that slipped through that gap, undetected by
        # check-katex for the same reason (see its files: pattern below,
        # widened the same way).
        #
        # explosion-fragment-model's source file (1-s2.0-S221491472030502X-main.md)
        # is excluded individually too: confirmed by direct repro (fix the
        # file, verify 0 flags with check-katex, run `pre-commit run mdformat
        # --all-files` alone, re-check) that mdformat --extensions mkdocs
        # still re-escapes `_` to `\_` and doubles a `\lambda` backslash on
        # this file's L34/L81/L119 specifically, even though the same
        # extension leaves the other 29 doc-reference files untouched. Not
        # yet root-caused to a specific line pattern; until it is, this file
        # is excluded like shell-he-105mm-m1.md rather than left to silently
        # regress every time mdformat runs.
        #
        # dod-1975-fragment-debris-hazards/card.md hits the same bug
        # (doubles `\rho`/`\text` on L32-33) — excluded individually too,
        # same reasoning.
        # kennedy1970-gurney-energy/source.md and ada540284-gurney-2d-extension/
        # ADA540284.md are raw OCR extractions whose scan noise (garbled glyph
        # runs, stray backslashes) makes mdformat's own round-trip check error
        # out entirely ("Formatted Markdown renders to different HTML than
        # input Markdown") rather than merely mis-format — excluded
        # individually too, same reasoning.
        #
        # mott-distribution-small-fragments/tavassoli-2000/tavassoli-2000-power-law.md
        # hits the identical round-trip-error bug (confirmed by direct
        # `mdformat --check` repro) — excluded individually too, same
        # reasoning.
        #
        # mott-distribution-small-fragments/elek-jaramaz-2009/
        # elek-jaramaz-2009-warhead-distribution.md is the same class of raw,
        # garbled-OCR extraction (mangled inline math interleaved with
        # numeral-looking prose, e.g. "2. FRAGMENT MASS..."); mdformat doesn't
        # error on it outright but re-escapes/reflows content on a source
        # meant to preserve the page verbatim — excluded on the same
        # source-fidelity grounds as the round-trip-error files above, not a
        # confirmed tool bug this time.
        #
        # ada462991-fragment-velocity/card.md hits the same doubled-backslash
        # bug as dod-1975 above, but on *inline* $...$ math ($\mu$ ->
        # $\\mu$), not just $$...$$ blocks — confirmed by direct repro
        # (mdformat-mkdocs re-escaped L27's \mu the moment the file was run
        # through the hook, reverted via `git checkout --`, re-excluded here).
        # Excluded individually like the others until root-caused.
        # OPEN-FINDINGS.md is generated by collect-findings.py and compared
        # byte-for-byte by its own --check hook below; letting a formatter own
        # it too would make the two hooks fight (generate → reformat → stale).
        exclude: '\.claude/agent-memory/|experiment/.*/updates/.*\.md$|openspec/.*\.md$|^OPEN-FINDINGS\.md$|doc-reference/fragmentation/explosion-fragment-model/1-s2\.0-S221491472030502X-main\.md$|doc-reference/fragmentation/dod-1975-fragment-debris-hazards/card\.md$|doc-reference/fragmentation/kennedy1970-gurney-energy/source\.md$|doc-reference/fragmentation/ada540284-gurney-2d-extension/ADA540284\.md$|doc-reference/fragmentation/ada462991-fragment-velocity/card\.md$|doc-reference/mott-distribution-small-fragments/tavassoli-2000/tavassoli-2000-power-law\.md$|doc-reference/mott-distribution-small-fragments/elek-jaramaz-2009/elek-jaramaz-2009-warhead-distribution\.md$'

      # Belt-and-suspenders counterpart to the mdformat exclude above: that
      # stops *tools* from introducing math-escaping corruption; this stops
      # already-corrupted math from ever being *committed*, regardless of
      # source (new PDF ingestion, a manual edit, a future formatter's own
      # bug). Scoped to the same math-bearing paths as the mdformat
      # exclude/.mdformat-ignore lists — openspec/ is the whole tree here too,
      # for the same archive/tasks.md coverage reason.
      - id: check-katex
        name: check-katex
        language: system
        entry: uv run python src/utils/check-katex.py --fail-on-flag
        files: '^(doc-reference/.*\.md$|.*\.qmd$|experiment/.*/updates/.*\.md$|openspec/.*\.md$)'
        pass_filenames: true

      # Keeps OPEN-FINDINGS.md in sync with the FINDING[...] markers scattered
      # through the tree, and fails a commit whose marker does not parse — a
      # typo'd marker would otherwise drop the finding silently, which is the
      # exact failure the register exists to prevent. always_run because a
      # finding closes by *deleting* its marker, often in a commit that touches
      # no file the register currently names.
      - id: collect-findings
        name: collect-findings
        language: system
        entry: uv run python src/utils/collect-findings.py --check
        always_run: true
        pass_filenames: false

      # Blocking backstop for agent-memory discipline. The PostToolUse hook of
      # the same script only *nudges* the writing agent after the write lands;
      # a background subagent that ends its turn never acts on it, so this
      # git-time gate is what actually keeps a status-log memory out of
      # history. Orthogonal to mdformat above: mdformat *excludes* agent-memory
      # (LaTeX safety), this hook *includes* only it.
      - id: agent-memory-discipline
        name: agent-memory-discipline
        language: system
        entry: python3 .claude/hooks/check_agent_memory.py
        files: '^\.claude/agent-memory/.*\.md$'
        pass_filenames: true

      - id: detect-secrets
        name: detect-secrets
        language: system
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        exclude: '(\.venv|\.ruff_cache|\.pytest_cache|uv\.lock)(/|$)'
        pass_filenames: true
